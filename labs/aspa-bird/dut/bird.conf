# =====================================================================
# Interconnection Guidelines - ASPA lab (Lesson 5.5)
# DUT - BIRD 2.16+ (2.17 tested) - AS64500
#
# ASPA (Autonomous System Provider Authorization): every AS publishes in
# the RPKI the list of its providers. A router that knows the relationship
# with each neighbour can then tell whether an AS path is plausible:
#   - from a customer or a peer (UPSTREAM): every hop must go from a
#     customer up to one of its providers
#   - from a provider (DOWNSTREAM): one way up, then one way down
#     ("no valleys")
# A hop that contradicts a published ASPA makes the path Invalid: that is
# a route leak, which ROV cannot see (the origin is legitimate).
#
# This lab focuses on ASPA only; the full policy is in labs/bird.
# Large communities: 64500:1:1 own  64500:1:2 transit  64500:1:3 customer
#                    64500:1:4 peer
# =====================================================================
router id 203.0.113.1;
log stderr all;

# ---- ASPA records ---------------------------------------------------
# Validated ASPA payloads loaded from a file, exactly as rpki-client
# writes them with "rpki-client -B" (cron + "birdc configure").
# ASPA over RTR (version 2) is still an IETF draft and validators and
# routers do not yet agree on the PDU format, so the file is the robust
# delivery method today.
aspa table at;
include "/etc/bird/aspa.conf";

protocol device { }

protocol static own_v4 {
  ipv4 { import filter { bgp_large_community.add((64500, 1, 1)); accept; }; };
  route 203.0.113.0/24 blackhole;
}

# Customer prefixes (generated from the IRR in production, Lesson 3.5)
define CUST_AS64511_V4 = [ 45.60.0.0/16, 45.61.0.0/16, 45.62.0.0/16 ];

# ---- Inbound -------------------------------------------------------
# Routes from our provider: downstream verification
filter transit_in {
  if aspa_check_downstream(at) = ASPA_INVALID then reject "ASPA invalid (route leak)";
  bgp_large_community.delete([(64500, 1, *)]);
  bgp_large_community.add((64500, 1, 2));
  bgp_local_pref = 100;
  accept;
}

# Routes from a peer or a customer: upstream verification
filter peer_in {
  if aspa_check_upstream(at) = ASPA_INVALID then reject "ASPA invalid (route leak)";
  bgp_large_community.delete([(64500, 1, *)]);
  bgp_large_community.add((64500, 1, 4));
  bgp_local_pref = 250;
  accept;
}

filter cust_in {
  if ! (net ~ CUST_AS64511_V4) then reject "not in customer IRR set";
  if aspa_check_upstream(at) = ASPA_INVALID then reject "ASPA invalid (route leak)";
  bgp_large_community.delete([(64500, 1, *)]);
  bgp_large_community.add((64500, 1, 3));
  bgp_local_pref = 300;
  accept;
}

# ---- Outbound ------------------------------------------------------
filter upstream_out {
  if (64500, 1, 1) ~ bgp_large_community then accept;
  if (64500, 1, 3) ~ bgp_large_community then accept;
  reject;
}
filter customer_out { accept; }

# ---- Sessions: the role tells ASPA which way a route travels --------
template bgp ebgp {
  local as 64500;
  ttl security on;
}

protocol bgp transit_a from ebgp {
  local 198.51.100.2;
  neighbor 198.51.100.1 as 64496;
  local role customer;
  ipv4 { import table on; import filter transit_in; export filter upstream_out; };
}

protocol bgp peer_as64497 from ebgp {
  local 198.51.100.10;
  neighbor 198.51.100.9 as 64497;
  local role peer;
  ipv4 { import table on; import filter peer_in; export filter upstream_out; };
}

protocol bgp cust_as64511 from ebgp {
  local 198.51.100.18;
  neighbor 198.51.100.17 as 64511;
  local role provider;
  ipv4 { import table on; import filter cust_in; export filter customer_out; };
}
