# =====================================================================
# Interconnection Guidelines and Operational Best Practices
# DUT - BIRD 3 (3.4 tested) - AS64500
#
# Same policy as labs/bird (BIRD 2): BIRD 3 reads BIRD 2 configurations
# almost unchanged. What changes is underneath: every protocol and table
# runs in its own thread (route servers with thousands of sessions are
# the main beneficiaries), tunable with the thread-group settings.
#
# Lab edition: documentation-space and documentation-ASN filters are
# disabled (marked PRODUCTION) because the lab itself uses them, and the
# sessions run without TCP-MD5/TCP-AO: many container hosts (OrbStack,
# Docker Desktop) have kernels without TCP-MD5 support. See the README.
# Large community scheme (Unit 4):
#   64500:1:1 own  64500:1:2 transit  64500:1:3 customer
#   64500:1:4 private peer  64500:1:5 IXP route server
#   64500:10:<asn> customer action: do not announce to <asn>
# =====================================================================
router id 203.0.113.1;
log stderr all;

# ---- Sets (Lessons 3.2-3.6) -----------------------------------------
define BOGONS_V4 = [ 0.0.0.0/8+, 10.0.0.0/8+, 100.64.0.0/10+, 127.0.0.0/8+,
  169.254.0.0/16+, 172.16.0.0/12+, 192.0.0.0/24+, 192.168.0.0/16+,
  198.18.0.0/15+, 224.0.0.0/4+, 240.0.0.0/4+ ];
define DOC_V4 = [ 192.0.2.0/24+, 198.51.100.0/24+, 203.0.113.0/24+ ];
define BOGONS_V6 = [ 2001:2::/48+, 2001:10::/28+, 2002::/16+, 3ffe::/16+ ];
define DOC_V6 = [ 2001:db8::/32+, 3fff::/20+ ];
define OWN_V4 = [ 203.0.113.0/24+ ];
define OWN_V6 = [ 2001:db8:500::/40+ ];
define IXP_LANS_V4 = [ 192.0.2.0/24+ ];
define BOGON_ASNS = [ 0, 23456, 64512..65535, 65552..131071, 4200000000..4294967295 ];
define DOC_ASNS = [ 64496..64511, 65536..65551 ];
define TRANSIT_ASNS = [ 174, 701, 1299, 2914, 3257, 3320, 3356, 3491,
  5511, 6453, 6461, 6762, 6830, 7018, 12956 ];

# Customer prefix set: generated, never typed (Lessons 3.5, 7.5)
#   bgpq4 -b -4 -A -m 24 -l CUST_AS64511_V4 AS64511:AS-CUSTOMERS
# PLACEHOLDER entry for the lab customer
define CUST_AS64511_V4 = [ 198.51.100.0/24 ];

# PRODUCTION: set to 1
define FILTER_DOCUMENTATION = 0;

# ---- RPKI (Lesson 5.2) ----------------------------------------------
roa4 table r4;
roa6 table r6;

protocol rpki validator1 {
  roa4 { table r4; };
  roa6 { table r6; };
  remote 192.0.2.53 port 3323;
  retry keep 10;
  refresh keep 60;
  expire keep 7200;
}

protocol rpki validator2 {
  roa4 { table r4; };
  roa6 { table r6; };
  remote 192.0.2.54 port 3323;
  retry keep 10;
  refresh keep 60;
  expire keep 7200;
}

# ---- Basic protocols ------------------------------------------------
protocol device { }

protocol kernel {
  ipv4 { export where source = RTS_BGP; };
}

# Own aggregates, tagged at origination (Lesson 4.3)
protocol static own_v4 {
  ipv4 { import filter { bgp_large_community.add((64500, 1, 1)); accept; }; };
  route 203.0.113.0/24 blackhole;
}
protocol static own_v6 {
  ipv6 { import filter { bgp_large_community.add((64500, 1, 1)); accept; }; };
  route 2001:db8:500::/40 blackhole;
}

# ---- Inbound sanity (Lessons 3.2-3.4, 3.7, 5.2) ---------------------
function sanity_in() {
  if net.type = NET_IP4 then {
    if net.len < 8 || net.len > 24 then reject "bad IPv4 length";
    if net ~ BOGONS_V4 then reject "IPv4 bogon";
    if FILTER_DOCUMENTATION = 1 && net ~ DOC_V4 then reject "IPv4 documentation";
    if net ~ OWN_V4 then reject "own IPv4 space";
    if net ~ IXP_LANS_V4 then reject "IXP peering LAN";
    if roa_check(r4, net, bgp_path.last) = ROA_INVALID then reject "RPKI invalid";
  } else {
    if net.len < 16 || net.len > 48 then reject "bad IPv6 length";
    if ! (net ~ [ 2000::/3+ ]) then reject "outside 2000::/3";
    if net ~ BOGONS_V6 then reject "IPv6 bogon";
    if FILTER_DOCUMENTATION = 1 && net ~ DOC_V6 then reject "IPv6 documentation";
    if net ~ OWN_V6 then reject "own IPv6 space";
    if roa_check(r6, net, bgp_path.last) = ROA_INVALID then reject "RPKI invalid";
  }
  if bgp_path ~ BOGON_ASNS then reject "bogon ASN in path";
  if FILTER_DOCUMENTATION = 1 && bgp_path ~ DOC_ASNS then reject "documentation ASN in path";
  if bgp_path.len > 50 then reject "AS path too long";
  # Scrub our informational communities (64500:1:*)
  bgp_large_community.delete([(64500, 1, *)]);
}

function honour_gshut() {
  if (65535, 0) ~ bgp_community then bgp_local_pref = 0;
}

filter transit_in {
  sanity_in();
  bgp_local_pref = 100;
  bgp_large_community.add((64500, 1, 2));
  honour_gshut();
  accept;
}

filter peer_in {
  sanity_in();
  if bgp_path ~ TRANSIT_ASNS then reject "transit ASN behind a peer";
  bgp_local_pref = 250;
  bgp_large_community.add((64500, 1, 4));
  honour_gshut();
  accept;
}

filter ixp_rs_in {
  sanity_in();
  if bgp_path ~ TRANSIT_ASNS then reject "transit ASN behind an IXP member";
  bgp_local_pref = 200;
  bgp_large_community.add((64500, 1, 5));
  honour_gshut();
  accept;
}

# Customer: only prefixes in the IRR-generated set (MANRS NO-1)
filter cust_as64511_in {
  sanity_in();
  if bgp_path ~ TRANSIT_ASNS then reject "transit ASN behind a customer";
  if ! (net ~ CUST_AS64511_V4) then reject "not in customer IRR set";
  bgp_local_pref = 300;
  bgp_large_community.add((64500, 1, 3));
  honour_gshut();
  accept;
}

# ---- Outbound (Lessons 4.4, 4.6) ------------------------------------
# Own and customer routes only; honour "do not announce to <peeras>".
function upstream_ok(int peeras) -> bool {
  if (64500, 10, peeras) ~ bgp_large_community then return false;
  if (64500, 1, 1) ~ bgp_large_community then return true;
  if (64500, 1, 3) ~ bgp_large_community then return true;
  return false;
}

filter to_64496 { if upstream_ok(64496) then accept; reject; }
filter to_64497 { if upstream_ok(64497) then accept; reject; }
filter to_64510 { if upstream_ok(64510) then accept; reject; }
filter customer_out { accept; }

# ---- Sessions (Lessons 2.1-2.5, 4.5, 6.1) ---------------------------
template bgp ebgp_session {
  local as 64500;
  ttl security on;        # GTSM (RFC 5082)
  # bfd on;               # enable together with a "protocol bfd"
}

protocol bgp transit_a from ebgp_session {
  description "TRANSIT-A";
  local 198.51.100.2;
  neighbor 198.51.100.1 as 64496;
  # lab: no TCP-MD5 (see README). Production: "authentication md5;"
  # plus "password <key>;" - or TCP-AO (BIRD 2.17+), Lesson 2.2
  local role customer;
  ipv4 {
    import table on;
    receive limit 1100000 action warn;
    import filter transit_in;
    export filter to_64496;
  };
}

protocol bgp peer_as64497 from ebgp_session {
  description "PEER-AS64497";
  local 198.51.100.10;
  neighbor 198.51.100.9 as 64497;
  # lab: no TCP-MD5 (see README). Production: "authentication md5;"
  # plus "password <key>;" - or TCP-AO (BIRD 2.17+), Lesson 2.2
  local role peer;
  ipv4 {
    import table on;
    receive limit 1200 action restart;
    import filter peer_in;
    export filter to_64497;
  };
}

protocol bgp ixp_rs1 from ebgp_session {
  description "IXP-RS1";
  local 192.0.2.50;
  neighbor 192.0.2.1 as 64510;
  enforce first as off;   # the route server does not prepend its ASN
  local role rs_client;
  ipv4 {
    import table on;
    receive limit 250000 action restart;
    import filter ixp_rs_in;
    export filter to_64510;
  };
}

protocol bgp ixp_rs2 from ebgp_session {
  description "IXP-RS2";
  local 192.0.2.50;
  neighbor 192.0.2.2 as 64510;
  enforce first as off;
  local role rs_client;
  ipv4 {
    import table on;
    receive limit 250000 action restart;
    import filter ixp_rs_in;
    export filter to_64510;
  };
}

protocol bgp cust_as64511 from ebgp_session {
  description "CUST-AS64511";
  local 198.51.100.18;
  neighbor 198.51.100.17 as 64511;
  # lab: no TCP-MD5 (see README). Production: "authentication md5;"
  # plus "password <key>;" - or TCP-AO (BIRD 2.17+), Lesson 2.2
  local role provider;
  ipv4 {
    import table on;
    receive limit 50 action restart;
    import filter cust_as64511_in;
    export filter customer_out;
  };
}

# Maintenance (Lesson 7.1): add bgp_community.add((65535, 0)) to the
# export filters of the sessions to drain, "birdc configure", work,
# then remove it again.

protocol bgp transit_a_v6 from ebgp_session {
  description "TRANSIT-A-V6";
  local 2001:db8:100::2;
  neighbor 2001:db8:100::1 as 64496;
  # lab: no TCP-MD5 (see README). Production: "authentication md5;"
  # plus "password <key>;" - or TCP-AO (BIRD 2.17+), Lesson 2.2
  local role customer;
  ipv6 {
    import table on;
    receive limit 250000 action warn;
    import filter transit_in;
    export filter to_64496;
  };
}
