# =====================================================================
# Interconnection Guidelines and Operational Best Practices
# DUT - OpenBGPD (portable 8.x / OpenBSD 7.x) - AS64500
#
# The same file works on OpenBSD and on OpenBGPD-portable (Linux).
#
# Lab edition: documentation-space and documentation-ASN filters are
# disabled (marked PRODUCTION) because the lab itself uses them, and the
# sessions run without TCP-MD5 (see the README).
#
# How OpenBGPD filters work (pf style):
#   - every rule is evaluated in order; the LAST matching allow/deny wins
#   - "quick" stops evaluation at that rule
#   - "match" rules only apply their "set" actions, in the order written
# So: default deny first, then what is allowed, then the set actions,
# then the "deny quick" safety rules that nothing can override.
#
# Large community scheme (Unit 4):
#   64500:1:1 own  64500:1:2 transit  64500:1:3 customer
#   64500:1:4 private peer  64500:1:5 IXP route server
#   64500:10:ASN customer action: do not announce to ASN
# =====================================================================
ASN="64500"
AS $ASN
router-id 203.0.113.1

# GoBGP-style control-plane-only use (container, route server): uncomment
# fib-update no

# ---- Sets (Lessons 3.2-3.6) -----------------------------------------
prefix-set own {
	203.0.113.0/24
	2001:db8:500::/40
}

prefix-set ixp-lans {
	192.0.2.0/24
}

prefix-set bogons {
	0.0.0.0/8 or-longer		# "this" network [RFC 1122]
	10.0.0.0/8 or-longer		# private [RFC 1918]
	100.64.0.0/10 or-longer		# CGN shared [RFC 6598]
	127.0.0.0/8 or-longer		# loopback
	169.254.0.0/16 or-longer	# link local
	172.16.0.0/12 or-longer		# private [RFC 1918]
	192.0.0.0/24 or-longer		# IETF protocol assignments
	192.88.99.0/24 or-longer	# 6to4 relay [RFC 7526]
	192.168.0.0/16 or-longer	# private [RFC 1918]
	198.18.0.0/15 or-longer		# benchmarking [RFC 2544]
	224.0.0.0/4 or-longer		# multicast
	240.0.0.0/4 or-longer		# reserved
	::/8 or-longer
	0100::/64 or-longer		# discard-only [RFC 6666]
	2001:2::/48 or-longer		# BMWG
	2001:10::/28 or-longer		# ORCHID
	2002::/16 or-longer		# 6to4
	3ffe::/16 or-longer		# old 6bone
	fc00::/7 or-longer		# ULA
	fe80::/10 or-longer		# link local
	fec0::/10 or-longer		# old site local
	ff00::/8 or-longer		# multicast
}

# PRODUCTION: documentation ranges (RFC 5737, RFC 3849, RFC 9637).
# The lab is built on them, so the rule using this set is commented out.
prefix-set documentation {
	192.0.2.0/24 or-longer
	198.51.100.0/24 or-longer
	203.0.113.0/24 or-longer
	2001:db8::/32 or-longer
	3fff::/20 or-longer
}

# Customer prefix set: generated, never typed (Lessons 3.5, 7.5)
#   bgpq4 -B -4 -A -m 24 -l cust-as64511 AS64511:AS-CUSTOMERS
# PLACEHOLDER entry for the lab customer
prefix-set cust-as64511 {
	198.51.100.0/24
}

# Large transit networks, never expected behind a peer, an IXP member or
# a customer (route leak, RFC 7908)
as-set transit-asns {
	174 701 1299 2914 3257 3320 3356 3491 5511 6453 6461 6762 6830 7018 12956
}

# ---- RPKI (Lesson 5.2, MANRS NO-4) ----------------------------------
# VRP updates received over RTR are applied immediately: routes are
# re-validated without a soft reset.
rtr 192.0.2.53 {
	descr "validator1"
	port 3323
}
rtr 192.0.2.54 {
	descr "validator2"
	port 3323
}

# ---- Own aggregates, tagged at origination (Lesson 4.3) -------------
network 203.0.113.0/24 set large-community $ASN:1:1
network 2001:db8:500::/40 set large-community $ASN:1:1

# ---- Sessions (Lessons 2.1-2.5, 4.5, 6.1) ---------------------------
# GTSM (RFC 5082) on every directly connected session.
# RFC 9234 roles: OpenBGPD sends the role capability and the OTC
# attribute, a second line of defence against route leaks.
# Lab: no TCP-MD5 (see README). Production: "tcp md5sig password KEY"
# in each neighbor block (Lesson 2.2).
group "transit" {
	role customer
	ttl-security yes
	neighbor 198.51.100.1 {
		remote-as 64496
		descr "TRANSIT-A"
		local-address 198.51.100.2
		max-prefix 1100000
	}
	neighbor 2001:db8:100::1 {
		remote-as 64496
		descr "TRANSIT-A-V6"
		local-address 2001:db8:100::2
		max-prefix 250000
	}
}

group "peers" {
	role peer
	ttl-security yes
	neighbor 198.51.100.9 {
		remote-as 64497
		descr "PEER-AS64497"
		local-address 198.51.100.10
		max-prefix 1200 restart 30
	}
}

group "ixp" {
	role rs-client
	ttl-security yes
	# The route servers do not prepend their ASN (RFC 7947)
	enforce neighbor-as no
	local-address 192.0.2.50
	max-prefix 250000 restart 30
	neighbor 192.0.2.1 {
		remote-as 64510
		descr "IXP-RS1"
	}
	neighbor 192.0.2.2 {
		remote-as 64510
		descr "IXP-RS2"
	}
}

group "customers" {
	role provider
	ttl-security yes
	neighbor 198.51.100.17 {
		remote-as 64511
		descr "CUST-AS64511"
		local-address 198.51.100.18
		max-prefix 50 restart 30
	}
}

# =====================================================================
# Filters
# =====================================================================

# ---- 1. Default deny, both directions (RFC 8212) --------------------
deny from any
deny to any

# ---- 2. Inbound: what each session may send -------------------------
allow from group "transit"
allow from group "peers"
allow from group "ixp"
# Customer: only prefixes in the IRR-generated set (MANRS NO-1)
allow from group "customers" prefix-set cust-as64511

# ---- 3. Inbound set actions, in this order --------------------------
# Scrub our informational communities 64500:1:* first (Lesson 3.7),
# then tag and set the preference per relationship (Lesson 4.2).
match from ebgp set { large-community delete $ASN:1:* }
match from group "transit"   set { localpref 100 large-community $ASN:1:2 }
match from group "peers"     set { localpref 250 large-community $ASN:1:4 }
match from group "ixp"       set { localpref 200 large-community $ASN:1:5 }
match from group "customers" set { localpref 300 large-community $ASN:1:3 }
# Graceful shutdown received (RFC 8326, Lesson 7.1)
match from ebgp community GRACEFUL_SHUTDOWN set { localpref 0 }

# ---- 4. Inbound safety rules: "quick", nothing overrides them -------
# Prefix length (Lesson 3.2)
deny quick from ebgp inet prefixlen < 8
deny quick from ebgp inet prefixlen > 24
deny quick from ebgp inet6 prefixlen < 16
deny quick from ebgp inet6 prefixlen > 48
# Bogons, our own space, IXP peering LANs (Lessons 3.2, 3.4)
deny quick from ebgp prefix-set bogons
# PRODUCTION: uncomment
# deny quick from ebgp prefix-set documentation
deny quick from ebgp prefix-set own or-longer
deny quick from ebgp prefix-set ixp-lans or-longer
# Bogon ASNs anywhere in the path (Lesson 3.3)
deny quick from ebgp AS 0
deny quick from ebgp AS 23456
deny quick from ebgp AS 64512 - 65535
deny quick from ebgp AS 65552 - 131071
deny quick from ebgp AS 4200000000 - 4294967295
# PRODUCTION: documentation ASNs (RFC 5398)
# deny quick from ebgp AS 64496 - 64511
# deny quick from ebgp AS 65536 - 65551
deny quick from ebgp max-as-len 50
# Route leaks: transit ASNs behind a peer, IXP member or customer (3.6)
deny quick from group "peers" AS as-set transit-asns
deny quick from group "ixp" AS as-set transit-asns
deny quick from group "customers" AS as-set transit-asns
# RPKI ROV: drop Invalid (Lesson 5.2)
deny quick from ebgp ovs invalid

# ---- 5. Outbound (Lessons 4.3, 4.4, 4.6) ----------------------------
# Customers get the full table
allow to group "customers"
# Everyone else: own and customer routes only, recognised by their tags
allow to group "transit" large-community $ASN:1:1
allow to group "transit" large-community $ASN:1:3
allow to group "peers" large-community $ASN:1:1
allow to group "peers" large-community $ASN:1:3
allow to group "ixp" large-community $ASN:1:1
allow to group "ixp" large-community $ASN:1:3
# Customer action communities: "do not announce to ASN" (Lesson 4.6)
deny quick to group "transit" large-community $ASN:10:64496
deny quick to group "peers" large-community $ASN:10:64497
deny quick to group "ixp" large-community $ASN:10:64510

# Maintenance (Lesson 7.1): to drain a session, add for example
#   match to group "transit" set { community GRACEFUL_SHUTDOWN }
# then "bgpctl reload", work, remove it and reload again.
