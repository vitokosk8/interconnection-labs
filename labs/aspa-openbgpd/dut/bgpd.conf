# =====================================================================
# Interconnection Guidelines - ASPA lab (Lesson 5.5)
# DUT - OpenBGPD 8.x - AS64500
#
# ASPA (Autonomous System Provider Authorization): every AS publishes in
# the RPKI the list of its providers. Knowing the relationship with each
# neighbour ("role"), the router can tell whether an AS path is plausible:
#   - from a customer or a peer (upstream): every hop goes from a customer
#     up to one of its providers
#   - from a provider (downstream): one way up, then one way down
# A hop that contradicts a published ASPA makes the path Invalid: a route
# leak, which ROV cannot see because the origin is legitimate.
#
# OpenBGPD sets the ASPA Validation State (avs) of every eBGP route; the
# role of the session decides upstream or downstream verification.
# This lab focuses on ASPA only; the full policy is in labs/openbgpd.
# =====================================================================
ASN="64500"
AS $ASN
router-id 203.0.113.1

# ---- ASPA records -----------------------------------------------------
# Validated ASPA payloads in the format rpki-client writes for OpenBGPD
# (default output, loaded with "bgpctl reload"). An "rtr" session can
# deliver them too; the file is the robust method while ASPA over RTR
# version 2 is still an IETF draft.
include "/etc/bgpd-aspa.conf"

prefix-set cust-as64511 {
	45.60.0.0/16
	45.61.0.0/16
	45.62.0.0/16
}

network 203.0.113.0/24 set large-community $ASN:1:1

# ---- Sessions: the role tells ASPA which way a route travels ---------
group "transit" {
	role customer
	ttl-security yes
	neighbor 198.51.100.1 {
		remote-as 64496
		local-address 198.51.100.2
	}
}
group "peers" {
	role peer
	ttl-security yes
	neighbor 198.51.100.9 {
		remote-as 64497
		local-address 198.51.100.10
	}
}
group "customers" {
	role provider
	ttl-security yes
	neighbor 198.51.100.17 {
		remote-as 64511
		local-address 198.51.100.18
	}
}

# ---- Filters (last match wins, "quick" stops) ------------------------
deny from any
deny to any

allow from group "transit"
allow from group "peers"
allow from group "customers" prefix-set cust-as64511

match from ebgp set { large-community delete $ASN:1:* }
match from group "transit"   set { localpref 100 large-community $ASN:1:2 }
match from group "peers"     set { localpref 250 large-community $ASN:1:4 }
match from group "customers" set { localpref 300 large-community $ASN:1:3 }

# ASPA: drop route leaks (Lesson 5.5). Roll out with "avs invalid" in a
# "match ... set { community ... }" rule first (log only), then deny.
deny quick from ebgp avs invalid

allow to group "customers"
allow to group "transit" large-community $ASN:1:1
allow to group "transit" large-community $ASN:1:3
allow to group "peers" large-community $ASN:1:1
allow to group "peers" large-community $ASN:1:3
