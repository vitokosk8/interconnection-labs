!=====================================================================
! LAB EDITION - adapted from the reference configuration for the containerlab topology:
!   - documentation-space entries stay commented (the lab uses that space)
!   - "system control-plane" binding left commented (keeps management)
!   - no TCP-MD5: container host kernels often lack it (see the README)
!   - no BFD: the lab neighbours do not run it
!   - RTR retry 10 s so the validators connect quickly after boot
!=====================================================================
service routing protocols model multi-agent
hostname dut
!
!=====================================================================
! Interconnection Guidelines and Operational Best Practices
! Reference configuration - Arista EOS / cEOS (4.3x)
!
! DOCUMENTATION-ONLY RESOURCES (RFC 5737 / RFC 3849 / RFC 5398).
! Adapt before use. Validate in a lab (cEOS in containerlab) first.
! Load with:  configure session GOLDEN  ->  paste  ->  show session-config diffs
!             ->  commit timer 00:10:00  ->  commit   (rollback if not confirmed)
!
! Topology (same as the other reference configurations)
!   AS64500 (us)          own: 203.0.113.0/24, 2001:db8:500::/40
!   Ethernet1  Transit A  AS64496  198.51.100.1 / 2001:db8:100::1
!   Ethernet2  Peer       AS64497  198.51.100.9
!   Ethernet3  IXP LAN 192.0.2.0/24, us .50, RS1 .1 / RS2 .2 (AS64510)
!   Ethernet4  Customer   AS64511  198.51.100.17, as-set AS64511:AS-CUSTOMERS
!
! Large community scheme (Unit 4)
!   64500:1:1 own  64500:1:2 transit  64500:1:3 customer
!   64500:1:4 private peer  64500:1:5 IXP route server
!   64500:10:ASN customer action: do not announce to ASN
!
! EOS notes
!   - Not RFC 8212 by default; "bgp missing-policy" below makes a
!     neighbor without route-map deny in both directions.
!   - GRACEFUL_SHUTDOWN (65535:0) is honoured by default (local-pref 0).
!     Sending it is done with maintenance mode (section 9).
!   - Not available: BGP Roles (RFC 9234), ASPA, TCP-AO (MD5 in production).
!=====================================================================
!
!---------------------------------------------------------------------
! 1. Interfaces (Lessons 2.4, 5.6, 6.2)
!---------------------------------------------------------------------
interface Ethernet1
   description TRANSIT-A AS64496
   no switchport
   ip address 198.51.100.2/30
   ipv6 address 2001:db8:100::2/64
   ! bfd interval 300 min-rx 300 multiplier 3   (production; lab neighbours run no BFD)
!
interface Ethernet2
   description PEER AS64497
   no switchport
   ip address 198.51.100.10/30
   ! bfd interval 300 min-rx 300 multiplier 3   (production; lab neighbours run no BFD)
!
interface Ethernet3
   description IXP PEERING LAN
   no switchport
   ip address 192.0.2.50/24
   no lldp transmit
   no lldp receive
   ipv6 nd ra disabled
!
interface Ethernet4
   description CUSTOMER AS64511
   no switchport
   ip address 198.51.100.18/30
   ! BCP 38 strict uRPF on the single-homed customer edge (MANRS NO-2)
   ! cEOS may reject this (hardware feature): the error is harmless in the lab
   ip verify unicast source reachable-via rx
   ! bfd interval 300 min-rx 300 multiplier 3   (production; lab neighbours run no BFD)
!
interface Loopback0
   ip address 203.0.113.1/32
!
!---------------------------------------------------------------------
! 2. Control plane: TCP/179 only from configured neighbors (Lesson 2.2)
!    Start from a copy of "default-control-plane-acl" (show ip access-lists
!    default-control-plane-acl) and insert these entries BEFORE its BGP
!    permit; keep all its other entries or management access is lost.
!---------------------------------------------------------------------
ip access-list CP-ACL
   10 permit tcp host 198.51.100.1 any eq bgp
   11 permit tcp host 198.51.100.1 eq bgp any
   20 permit tcp host 198.51.100.9 any eq bgp
   21 permit tcp host 198.51.100.9 eq bgp any
   30 permit tcp host 192.0.2.1 any eq bgp
   31 permit tcp host 192.0.2.1 eq bgp any
   40 permit tcp host 192.0.2.2 any eq bgp
   41 permit tcp host 192.0.2.2 eq bgp any
   50 permit tcp host 198.51.100.17 any eq bgp
   51 permit tcp host 198.51.100.17 eq bgp any
   90 deny tcp any any eq bgp
   ! 100+ : the remaining entries copied from default-control-plane-acl
!
! system control-plane
!    ip access-group CP-ACL in
!
!---------------------------------------------------------------------
! 3. Own prefixes: discard routes as origination anchors (Lesson 4.3)
!    RTBH trigger routes are tagged 666 (Lesson 6.4)
!---------------------------------------------------------------------
ip routing
ipv6 unicast-routing
ip route 203.0.113.0/24 Null0
ipv6 route 2001:db8:500::/40 Null0
! ip route 203.0.113.66/32 Null0 tag 666   (RTBH during an attack)
!
!---------------------------------------------------------------------
! 4. Prefix lists (Lessons 3.2, 3.4)
!    "permit" here means "matches"; the route-maps decide.
!---------------------------------------------------------------------
ip prefix-list BOGONS-V4
   seq 10 permit 0.0.0.0/8 le 32
   seq 20 permit 10.0.0.0/8 le 32
   seq 30 permit 100.64.0.0/10 le 32
   seq 40 permit 127.0.0.0/8 le 32
   seq 50 permit 169.254.0.0/16 le 32
   seq 60 permit 172.16.0.0/12 le 32
   seq 70 permit 192.0.0.0/24 le 32
   seq 80 permit 192.168.0.0/16 le 32
   seq 90 permit 198.18.0.0/15 le 32
   seq 100 permit 224.0.0.0/4 le 32
   seq 110 permit 240.0.0.0/4 le 32
!
ip prefix-list BAD-LENGTH-V4
   seq 10 permit 0.0.0.0/0 le 7
   seq 20 permit 0.0.0.0/0 ge 25
!
! Documentation space - kept apart because the lab uses it.
! PRODUCTION: un-comment the "deny 25/26" entries in SANITY-IN.
ip prefix-list DOC-V4
   seq 10 permit 192.0.2.0/24 le 32
   seq 20 permit 198.51.100.0/24 le 32
   seq 30 permit 203.0.113.0/24 le 32
!
ip prefix-list OWN-V4
   seq 10 permit 203.0.113.0/24 le 32
!
ip prefix-list OWN-HOSTS-V4
   seq 10 permit 203.0.113.0/24 ge 32
!
ip prefix-list IXP-LANS-V4
   seq 10 permit 192.0.2.0/24 le 32
!
ipv6 prefix-list BOGONS-V6
   seq 10 permit ::/3 le 128
   seq 20 permit 4000::/2 le 128
   seq 30 permit 8000::/1 le 128
   seq 40 permit 2001:2::/48 le 128
   seq 50 permit 2001:10::/28 le 128
   seq 60 permit 2002::/16 le 128
   seq 70 permit 3ffe::/16 le 128
!
ipv6 prefix-list BAD-LENGTH-V6
   seq 10 permit ::/0 le 15
   seq 20 permit ::/0 ge 49
!
ipv6 prefix-list DOC-V6
   seq 10 permit 2001:db8::/32 le 128
   seq 20 permit 3fff::/20 le 128
!
ipv6 prefix-list OWN-V6
   seq 10 permit 2001:db8:500::/40 le 128
!
! Customer prefix lists: generated, never typed (Lessons 3.5, 7.5)
!   bgpq4 -e -4 -A -m 24 -l CUST-AS64511-V4 AS64511:AS-CUSTOMERS
!   bgpq4 -e -6 -A -m 48 -l CUST-AS64511-V6 AS64511:AS-CUSTOMERS
! PLACEHOLDER entries - replace with the bgpq4 output
ip prefix-list CUST-AS64511-V4
   seq 10 permit 198.51.100.0/24
!
ipv6 prefix-list CUST-AS64511-V6
   seq 10 permit 2001:db8:6400::/40 le 48
!
!---------------------------------------------------------------------
! 5. AS-path lists (Lessons 3.3, 3.6)
!---------------------------------------------------------------------
ip as-path access-list BOGON-ASNS permit _0_ any
ip as-path access-list BOGON-ASNS permit _23456_ any
ip as-path access-list BOGON-ASNS permit _(6451[2-9]|645[2-9][0-9]|64[6-9][0-9][0-9]|65[0-4][0-9][0-9]|655[0-2][0-9]|6553[0-5])_ any
ip as-path access-list BOGON-ASNS permit _(6555[2-9]|655[6-9][0-9]|65[6-9][0-9][0-9]|6[6-9][0-9][0-9][0-9]|[7-9][0-9][0-9][0-9][0-9])_ any
ip as-path access-list BOGON-ASNS permit _(1[0-2][0-9][0-9][0-9][0-9]|130[0-9][0-9][0-9]|1310[0-6][0-9]|13107[01])_ any
ip as-path access-list BOGON-ASNS permit _42[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_ any
!
! Documentation ASNs (RFC 5398). PRODUCTION: un-comment "deny 35" in SANITY-IN.
ip as-path access-list DOC-ASNS permit _(6449[6-9]|6450[0-9]|6451[01])_ any
ip as-path access-list DOC-ASNS permit _(6553[6-9]|6554[0-9]|6555[01])_ any
!
ip as-path access-list TRANSIT-ASNS permit _(174|701|1299|2914|3257|3320|3356|3491|5511|6453|6461|6762|6830|7018|12956)_ any
!
!---------------------------------------------------------------------
! 6. Community lists (Lessons 3.7, 4.2, 4.6, 6.4)
!---------------------------------------------------------------------
ip community-list BLACKHOLE permit 65535:666
! Our informational tags, removed from every route we receive (Lesson 3.7)
ip large-community-list OWN-INFO permit 64500:1:1
ip large-community-list OWN-INFO permit 64500:1:2
ip large-community-list OWN-INFO permit 64500:1:3
ip large-community-list OWN-INFO permit 64500:1:4
ip large-community-list OWN-INFO permit 64500:1:5
ip large-community-list TAG-OWN permit 64500:1:1
ip large-community-list TAG-CUST permit 64500:1:3
ip large-community-list DNA-64496 permit 64500:10:64496
ip large-community-list DNA-64497 permit 64500:10:64497
ip large-community-list DNA-64510 permit 64500:10:64510
!
!---------------------------------------------------------------------
! 7. Inbound route-maps (Lessons 3.1-3.7, 4.2, 5.2)
!    SANITY-IN is called from every inbound map with sub-route-map.
!---------------------------------------------------------------------
route-map SANITY-IN deny 10
   match ip address prefix-list BOGONS-V4
route-map SANITY-IN deny 11
   match ip address prefix-list BAD-LENGTH-V4
route-map SANITY-IN deny 12
   match ipv6 address prefix-list BOGONS-V6
route-map SANITY-IN deny 13
   match ipv6 address prefix-list BAD-LENGTH-V6
! PRODUCTION: un-comment
! route-map SANITY-IN deny 25
!    match ip address prefix-list DOC-V4
! route-map SANITY-IN deny 26
!    match ipv6 address prefix-list DOC-V6
route-map SANITY-IN deny 30
   match as-path BOGON-ASNS
! PRODUCTION: un-comment
! route-map SANITY-IN deny 35
!    match as-path DOC-ASNS
route-map SANITY-IN deny 40
   match as-path length >= 51
route-map SANITY-IN deny 50
   match ip address prefix-list OWN-V4
route-map SANITY-IN deny 51
   match ipv6 address prefix-list OWN-V6
route-map SANITY-IN deny 52
   match ip address prefix-list IXP-LANS-V4
route-map SANITY-IN deny 60
   match origin-as validity invalid
route-map SANITY-IN permit 100
   ! Scrub our informational communities
   set large-community large-community-list OWN-INFO delete
!
route-map NO-TRANSIT-ASN deny 10
   match as-path TRANSIT-ASNS
route-map NO-TRANSIT-ASN permit 100
!
route-map TRANSIT-IN permit 10
   sub-route-map SANITY-IN
   set local-preference 100
   set large-community 64500:1:2 additive
!
route-map PEER-IN deny 5
   match as-path TRANSIT-ASNS
route-map PEER-IN permit 10
   sub-route-map SANITY-IN
   set local-preference 250
   set large-community 64500:1:4 additive
!
route-map IXP-RS-IN deny 5
   match as-path TRANSIT-ASNS
route-map IXP-RS-IN permit 10
   sub-route-map SANITY-IN
   set local-preference 200
   set large-community 64500:1:5 additive
!
! Customer: only prefixes in the IRR-generated lists (MANRS NO-1)
route-map CUST-AS64511-IN deny 5
   match as-path TRANSIT-ASNS
route-map CUST-AS64511-IN permit 10
   match ip address prefix-list CUST-AS64511-V4
   sub-route-map SANITY-IN
   set local-preference 300
   set large-community 64500:1:3 additive
route-map CUST-AS64511-IN permit 11
   match ipv6 address prefix-list CUST-AS64511-V6
   sub-route-map SANITY-IN
   set local-preference 300
   set large-community 64500:1:3 additive
! implicit deny: anything not in the customer lists
!
! GRACEFUL_SHUTDOWN (65535:0) is honoured by EOS by default: no entry needed.
!
!---------------------------------------------------------------------
! 8. Origination and outbound route-maps (Lessons 4.3, 4.4, 4.6, 6.4)
!---------------------------------------------------------------------
route-map ORIGINATE permit 10
   set large-community 64500:1:1
!
route-map RTBH-ORIGINATE permit 10
   match tag 666
   match ip address prefix-list OWN-HOSTS-V4
   set community 65535:666 no-export
   set large-community 64500:1:1
!
route-map UPSTREAM-OUT permit 10
   match community BLACKHOLE
   match ip address prefix-list OWN-HOSTS-V4
route-map UPSTREAM-OUT deny 15
   match community BLACKHOLE
route-map UPSTREAM-OUT permit 20
   match large-community TAG-OWN
route-map UPSTREAM-OUT permit 30
   match large-community TAG-CUST
! implicit deny: transit and peer routes never leave (MANRS NO-1)
!
! Per-neighbor wrappers: "do not announce to ASN", then the shared map
route-map TO-64496 deny 5
   match large-community DNA-64496
route-map TO-64496 permit 10
   sub-route-map UPSTREAM-OUT
!
route-map TO-64497 deny 5
   match large-community DNA-64497
route-map TO-64497 permit 10
   sub-route-map UPSTREAM-OUT
!
route-map TO-64510 deny 5
   match large-community DNA-64510
route-map TO-64510 permit 10
   sub-route-map UPSTREAM-OUT
!
route-map CUSTOMER-OUT permit 10
   ! Full table (or restrict to a default route per contract)
!
!---------------------------------------------------------------------
! 9. BGP (Lessons 2.1-2.4, 5.2, 6.1)
!---------------------------------------------------------------------
router bgp 64500
   router-id 203.0.113.1
   ! RFC 8212: no route-map = deny, in both directions
   bgp missing-policy direction in action deny
   bgp missing-policy direction out action deny
   !
   rpki cache VALIDATOR-1
      host 192.0.2.53 port 3323
      local-interface Loopback0
      ! default retry is 600 s: too slow to recover from a validator outage
      retry-interval 10
      refresh-interval 60
   rpki cache VALIDATOR-2
      host 192.0.2.54 port 3323
      local-interface Loopback0
      retry-interval 10
      refresh-interval 60
   rpki origin-validation
      ebgp local
   !
   neighbor 198.51.100.1 remote-as 64496
   neighbor 198.51.100.1 description TRANSIT-A
   neighbor 198.51.100.1 ttl maximum-hops 1
   ! lab: no TCP-MD5 (see README). Production: neighbor 198.51.100.1 password 0 <key>
   ! neighbor 198.51.100.1 bfd   (production)
   neighbor 198.51.100.1 send-community standard extended large
   neighbor 198.51.100.1 route-map TRANSIT-IN in
   neighbor 198.51.100.1 route-map TO-64496 out
   ! Full table: high limit, warning only
   neighbor 198.51.100.1 maximum-routes 1100000 warning-only
   !
   neighbor 2001:db8:100::1 remote-as 64496
   neighbor 2001:db8:100::1 description TRANSIT-A-V6
   neighbor 2001:db8:100::1 ttl maximum-hops 1
   ! lab: no TCP-MD5 (see README). Production: neighbor 2001:db8:100::1 password 0 <key>
   neighbor 2001:db8:100::1 send-community standard extended large
   neighbor 2001:db8:100::1 route-map TRANSIT-IN in
   neighbor 2001:db8:100::1 route-map TO-64496 out
   neighbor 2001:db8:100::1 maximum-routes 250000 warning-only
   !
   neighbor 198.51.100.9 remote-as 64497
   neighbor 198.51.100.9 description PEER-AS64497
   neighbor 198.51.100.9 ttl maximum-hops 1
   ! lab: no TCP-MD5 (see README). Production: neighbor 198.51.100.9 password 0 <key>
   ! neighbor 198.51.100.9 bfd   (production)
   neighbor 198.51.100.9 send-community standard extended large
   neighbor 198.51.100.9 route-map PEER-IN in
   neighbor 198.51.100.9 route-map TO-64497 out
   ! PeeringDB count + 20 %; session goes down at the limit
   neighbor 198.51.100.9 maximum-routes 1200 warning-limit 90 percent
   neighbor 198.51.100.9 idle-restart-timer 1800
   !
   neighbor 192.0.2.1 remote-as 64510
   neighbor 192.0.2.1 description IXP-RS1
   neighbor 192.0.2.1 ttl maximum-hops 1
   ! The route server does not prepend its ASN (RFC 7947)
   no neighbor 192.0.2.1 enforce-first-as
   neighbor 192.0.2.1 send-community standard extended large
   neighbor 192.0.2.1 route-map IXP-RS-IN in
   neighbor 192.0.2.1 route-map TO-64510 out
   neighbor 192.0.2.1 maximum-routes 250000 warning-limit 90 percent
   neighbor 192.0.2.1 idle-restart-timer 1800
   neighbor 192.0.2.2 remote-as 64510
   neighbor 192.0.2.2 description IXP-RS2
   neighbor 192.0.2.2 ttl maximum-hops 1
   no neighbor 192.0.2.2 enforce-first-as
   neighbor 192.0.2.2 send-community standard extended large
   neighbor 192.0.2.2 route-map IXP-RS-IN in
   neighbor 192.0.2.2 route-map TO-64510 out
   neighbor 192.0.2.2 maximum-routes 250000 warning-limit 90 percent
   neighbor 192.0.2.2 idle-restart-timer 1800
   !
   neighbor 198.51.100.17 remote-as 64511
   neighbor 198.51.100.17 description CUST-AS64511
   neighbor 198.51.100.17 ttl maximum-hops 1
   ! lab: no TCP-MD5 (see README). Production: neighbor 198.51.100.17 password 0 <key>
   ! neighbor 198.51.100.17 bfd   (production)
   neighbor 198.51.100.17 send-community standard extended large
   neighbor 198.51.100.17 route-map CUST-AS64511-IN in
   neighbor 198.51.100.17 route-map CUSTOMER-OUT out
   ! Size of the generated prefix list + margin
   neighbor 198.51.100.17 maximum-routes 50 warning-limit 90 percent
   neighbor 198.51.100.17 idle-restart-timer 1800
   !
   address-family ipv4
      neighbor 198.51.100.1 activate
      neighbor 198.51.100.9 activate
      neighbor 192.0.2.1 activate
      neighbor 192.0.2.2 activate
      neighbor 198.51.100.17 activate
      no neighbor 2001:db8:100::1 activate
      network 203.0.113.0/24 route-map ORIGINATE
      redistribute static route-map RTBH-ORIGINATE
   !
   address-family ipv6
      neighbor 2001:db8:100::1 activate
      network 2001:db8:500::/40 route-map ORIGINATE
!
!---------------------------------------------------------------------
! Notes
!---------------------------------------------------------------------
! Maintenance (Lesson 7.1) - drain one neighbor with GRACEFUL_SHUTDOWN
! (maintenance mode applies "set community GSHUT additive" and
! local-preference 0), then shut the session:
!   maintenance
!      bgp 198.51.100.1
!         quiesce
! Return to service with "no quiesce".
!
! Checks:
!   show ip bgp summary
!   show ip bgp neighbors 198.51.100.1 advertised-routes
!   show bgp rpki cache
!   show bgp rpki roa summary
