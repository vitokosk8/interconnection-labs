! =====================================================================
! Interconnection Guidelines and Operational Best Practices
! DUT - FRRouting 10.x - AS64500
!
! Lab edition: documentation-space and documentation-ASN filters are
! commented out (marked PRODUCTION) because the lab itself uses them.
! Large community scheme (Unit 4):
!   64500:1:1 own  64500:1:2 transit  64500:1:3 customer
!   64500:1:4 private peer  64500:1:5 IXP route server
!   64500:10:<asn> customer action: do not announce to <asn>
! =====================================================================
frr defaults traditional
hostname dut
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description TRANSIT-A AS64496
 ip address 198.51.100.2/30
 ipv6 address 2001:db8:100::2/64
exit
interface eth2
 description PEER AS64497
 ip address 198.51.100.10/30
exit
interface eth3
 description IXP PEERING LAN
 ip address 192.0.2.50/24
 ipv6 nd suppress-ra
exit
interface eth4
 description CUSTOMER AS64511
 ip address 198.51.100.18/30
exit
interface lo
 ip address 203.0.113.1/32
exit
!
! ---- Own prefixes: discard anchors (Lesson 4.3) ---------------------
ip route 203.0.113.0/24 blackhole
ipv6 route 2001:db8:500::/40 blackhole
! RTBH during an attack (Lesson 6.4):
! ip route 203.0.113.66/32 blackhole tag 666
!
! ---- Prefix lists (Lessons 3.2, 3.4) --------------------------------
ip prefix-list BAD-LENGTH-V4 seq 10 permit 0.0.0.0/0 le 7
ip prefix-list BAD-LENGTH-V4 seq 20 permit 0.0.0.0/0 ge 25
ip prefix-list BOGONS-V4 seq 10 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS-V4 seq 20 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS-V4 seq 30 permit 100.64.0.0/10 le 32
ip prefix-list BOGONS-V4 seq 40 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS-V4 seq 50 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS-V4 seq 60 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS-V4 seq 70 permit 192.0.0.0/24 le 32
ip prefix-list BOGONS-V4 seq 80 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS-V4 seq 90 permit 198.18.0.0/15 le 32
ip prefix-list BOGONS-V4 seq 100 permit 224.0.0.0/4 le 32
ip prefix-list BOGONS-V4 seq 110 permit 240.0.0.0/4 le 32
ip prefix-list DOC-V4 seq 10 permit 192.0.2.0/24 le 32
ip prefix-list DOC-V4 seq 20 permit 198.51.100.0/24 le 32
ip prefix-list DOC-V4 seq 30 permit 203.0.113.0/24 le 32
ip prefix-list OWN-V4 seq 10 permit 203.0.113.0/24 le 32
ip prefix-list OWN-HOSTS-V4 seq 10 permit 203.0.113.0/24 ge 32
ip prefix-list IXP-LANS-V4 seq 10 permit 192.0.2.0/24 le 32
!
ipv6 prefix-list BAD-LENGTH-V6 seq 10 permit ::/0 le 15
ipv6 prefix-list BAD-LENGTH-V6 seq 20 permit ::/0 ge 49
ipv6 prefix-list BOGONS-V6 seq 10 permit ::/3 le 128
ipv6 prefix-list BOGONS-V6 seq 20 permit 4000::/2 le 128
ipv6 prefix-list BOGONS-V6 seq 30 permit 8000::/1 le 128
ipv6 prefix-list BOGONS-V6 seq 40 permit 2001:2::/48 le 128
ipv6 prefix-list BOGONS-V6 seq 50 permit 2001:10::/28 le 128
ipv6 prefix-list BOGONS-V6 seq 60 permit 2002::/16 le 128
ipv6 prefix-list BOGONS-V6 seq 70 permit 3ffe::/16 le 128
ipv6 prefix-list DOC-V6 seq 10 permit 2001:db8::/32 le 128
ipv6 prefix-list DOC-V6 seq 20 permit 3fff::/20 le 128
ipv6 prefix-list OWN-V6 seq 10 permit 2001:db8:500::/40 le 128
!
! Customer prefix lists: generated, never typed (Lessons 3.5, 7.5)
!   bgpq4 -4 -A -m 24 -l CUST-AS64511-V4 AS64511:AS-CUSTOMERS
!   bgpq4 -6 -A -m 48 -l CUST-AS64511-V6 AS64511:AS-CUSTOMERS
! PLACEHOLDER entries for the lab customer
ip prefix-list CUST-AS64511-V4 seq 5 permit 198.51.100.0/24
ipv6 prefix-list CUST-AS64511-V6 seq 5 permit 2001:db8:6400::/40 le 48
!
! ---- AS paths (Lessons 3.3, 3.6) ------------------------------------
bgp as-path access-list BOGON-ASN seq 10 permit _0_
bgp as-path access-list BOGON-ASN seq 20 permit _23456_
bgp as-path access-list BOGON-ASN seq 30 permit _(6451[2-9]|645[2-9][0-9]|64[6-9][0-9][0-9]|65[0-4][0-9][0-9]|655[0-2][0-9]|6553[0-5])_
bgp as-path access-list BOGON-ASN seq 40 permit _(6555[2-9]|655[6-9][0-9]|65[6-9][0-9][0-9]|6[6-9][0-9][0-9][0-9]|[7-9][0-9][0-9][0-9][0-9])_
bgp as-path access-list BOGON-ASN seq 50 permit _(1[0-2][0-9][0-9][0-9][0-9]|130[0-9][0-9][0-9]|1310[0-6][0-9]|13107[01])_
bgp as-path access-list BOGON-ASN seq 60 permit _42[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_
bgp as-path access-list DOC-ASN seq 10 permit _(6449[6-9]|6450[0-9]|6451[01])_
bgp as-path access-list DOC-ASN seq 20 permit _(6553[6-9]|6554[0-9]|6555[01])_
! 51 or more ASNs in the path
bgp as-path access-list LONG-PATH seq 10 permit ([0-9]+ ){50}[0-9]+
bgp as-path access-list TRANSIT-ASN seq 10 permit _(174|701|1299|2914|3257|3320|3356|3491|5511|6453|6461|6762|6830|7018|12956)_
!
! ---- Communities (Lessons 3.7, 4.2, 4.6, 6.4, 7.1) ------------------
bgp community-list standard GSHUT seq 10 permit graceful-shutdown
bgp community-list standard BLACKHOLE seq 10 permit blackhole
bgp large-community-list standard OWN-INFO seq 10 permit 64500:1:1
bgp large-community-list standard OWN-INFO seq 20 permit 64500:1:2
bgp large-community-list standard OWN-INFO seq 30 permit 64500:1:3
bgp large-community-list standard OWN-INFO seq 40 permit 64500:1:4
bgp large-community-list standard OWN-INFO seq 50 permit 64500:1:5
bgp large-community-list standard TAG-OWN seq 10 permit 64500:1:1
bgp large-community-list standard TAG-CUST seq 10 permit 64500:1:3
bgp large-community-list standard DNA-64496 seq 10 permit 64500:10:64496
bgp large-community-list standard DNA-64497 seq 10 permit 64500:10:64497
bgp large-community-list standard DNA-64510 seq 10 permit 64500:10:64510
!
! ---- Inbound: shared sanity map, called by every session map --------
route-map SANITY-IN deny 10
 match ip address prefix-list BAD-LENGTH-V4
exit
route-map SANITY-IN deny 11
 match ip address prefix-list BOGONS-V4
exit
route-map SANITY-IN deny 12
 match ipv6 address prefix-list BAD-LENGTH-V6
exit
route-map SANITY-IN deny 13
 match ipv6 address prefix-list BOGONS-V6
exit
! PRODUCTION: un-comment
! route-map SANITY-IN deny 25
!  match ip address prefix-list DOC-V4
! exit
! route-map SANITY-IN deny 26
!  match ipv6 address prefix-list DOC-V6
! exit
route-map SANITY-IN deny 30
 match as-path BOGON-ASN
exit
! PRODUCTION: un-comment
! route-map SANITY-IN deny 35
!  match as-path DOC-ASN
! exit
route-map SANITY-IN deny 40
 match as-path LONG-PATH
exit
route-map SANITY-IN deny 50
 match ip address prefix-list OWN-V4
exit
route-map SANITY-IN deny 51
 match ipv6 address prefix-list OWN-V6
exit
route-map SANITY-IN deny 52
 match ip address prefix-list IXP-LANS-V4
exit
route-map SANITY-IN deny 60
 match rpki invalid
exit
route-map SANITY-IN permit 100
 set large-comm-list OWN-INFO delete
exit
!
! Session maps: 5 = sanity, 6 = transit-ASN check, 10 = tag + local-pref,
! 20 = honour GRACEFUL_SHUTDOWN, 30 = accept.
route-map TRANSIT-IN permit 5
 call SANITY-IN
 on-match next
exit
route-map TRANSIT-IN permit 10
 set local-preference 100
 set large-community 64500:1:2 additive
 on-match next
exit
route-map TRANSIT-IN permit 20
 match community GSHUT
 set local-preference 0
exit
route-map TRANSIT-IN permit 30
exit
!
route-map PEER-IN permit 5
 call SANITY-IN
 on-match next
exit
route-map PEER-IN deny 6
 match as-path TRANSIT-ASN
exit
route-map PEER-IN permit 10
 set local-preference 250
 set large-community 64500:1:4 additive
 on-match next
exit
route-map PEER-IN permit 20
 match community GSHUT
 set local-preference 0
exit
route-map PEER-IN permit 30
exit
!
route-map IXP-RS-IN permit 5
 call SANITY-IN
 on-match next
exit
route-map IXP-RS-IN deny 6
 match as-path TRANSIT-ASN
exit
route-map IXP-RS-IN permit 10
 set local-preference 200
 set large-community 64500:1:5 additive
 on-match next
exit
route-map IXP-RS-IN permit 20
 match community GSHUT
 set local-preference 0
exit
route-map IXP-RS-IN permit 30
exit
!
! Customer: only prefixes in the IRR-generated lists (MANRS NO-1)
route-map CUST-AS64511-IN permit 5
 call SANITY-IN
 on-match next
exit
route-map CUST-AS64511-IN deny 6
 match as-path TRANSIT-ASN
exit
route-map CUST-AS64511-IN permit 10
 match ip address prefix-list CUST-AS64511-V4
 set local-preference 300
 set large-community 64500:1:3 additive
 on-match goto 20
exit
route-map CUST-AS64511-IN permit 11
 match ipv6 address prefix-list CUST-AS64511-V6
 set local-preference 300
 set large-community 64500:1:3 additive
 on-match goto 20
exit
route-map CUST-AS64511-IN deny 15
exit
route-map CUST-AS64511-IN permit 20
 match community GSHUT
 set local-preference 0
exit
route-map CUST-AS64511-IN permit 30
exit
!
! ---- Origination and outbound (Lessons 4.3, 4.4, 4.6, 6.4) ----------
route-map ORIGINATE permit 10
 set large-community 64500:1:1
exit
!
route-map RTBH-ORIGINATE permit 10
 match tag 666
 match ip address prefix-list OWN-HOSTS-V4
 set community blackhole no-export
 set large-community 64500:1:1
exit
!
route-map UPSTREAM-OUT permit 10
 match community BLACKHOLE
 match ip address prefix-list OWN-HOSTS-V4
exit
route-map UPSTREAM-OUT deny 15
 match community BLACKHOLE
exit
route-map UPSTREAM-OUT permit 20
 match large-community TAG-OWN
exit
route-map UPSTREAM-OUT permit 30
 match large-community TAG-CUST
exit
! implicit deny: transit and peer routes never leave (MANRS NO-1)
!
route-map TO-64496 deny 5
 match large-community DNA-64496
exit
route-map TO-64496 permit 10
 call UPSTREAM-OUT
exit
route-map TO-64497 deny 5
 match large-community DNA-64497
exit
route-map TO-64497 permit 10
 call UPSTREAM-OUT
exit
route-map TO-64510 deny 5
 match large-community DNA-64510
exit
route-map TO-64510 permit 10
 call UPSTREAM-OUT
exit
!
route-map CUSTOMER-OUT permit 10
exit
!
! ---- RPKI (Lesson 5.2) - FRR 10.x syntax ----------------------------
rpki
 rpki polling_period 30
 rpki retry_interval 30
 rpki cache tcp 192.0.2.53 3323 preference 1
 rpki cache tcp 192.0.2.54 3323 preference 2
exit
!
! ---- BGP (Lessons 2.1-2.5, 4.5, 6.1) --------------------------------
router bgp 64500
 bgp router-id 203.0.113.1
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 !
 neighbor 198.51.100.1 remote-as 64496
 neighbor 198.51.100.1 description TRANSIT-A
 neighbor 198.51.100.1 ttl-security hops 1
 ! lab: no TCP-MD5 (see README) - production: neighbor 198.51.100.1 password <key>
 neighbor 198.51.100.1 local-role customer
 neighbor 2001:db8:100::1 remote-as 64496
 neighbor 2001:db8:100::1 description TRANSIT-A-V6
 neighbor 2001:db8:100::1 ttl-security hops 1
 ! lab: no TCP-MD5 (see README) - production: neighbor 2001:db8:100::1 password <key>
 neighbor 2001:db8:100::1 local-role customer
 neighbor 198.51.100.9 remote-as 64497
 neighbor 198.51.100.9 description PEER-AS64497
 neighbor 198.51.100.9 ttl-security hops 1
 ! lab: no TCP-MD5 (see README) - production: neighbor 198.51.100.9 password <key>
 neighbor 198.51.100.9 local-role peer
 neighbor 192.0.2.1 remote-as 64510
 neighbor 192.0.2.1 description IXP-RS1
 neighbor 192.0.2.1 ttl-security hops 1
 neighbor 192.0.2.1 local-role rs-client
 no neighbor 192.0.2.1 enforce-first-as
 neighbor 192.0.2.2 remote-as 64510
 neighbor 192.0.2.2 description IXP-RS2
 neighbor 192.0.2.2 ttl-security hops 1
 neighbor 192.0.2.2 local-role rs-client
 no neighbor 192.0.2.2 enforce-first-as
 neighbor 198.51.100.17 remote-as 64511
 neighbor 198.51.100.17 description CUST-AS64511
 neighbor 198.51.100.17 ttl-security hops 1
 ! lab: no TCP-MD5 (see README) - production: neighbor 198.51.100.17 password <key>
 neighbor 198.51.100.17 local-role provider
 !
 address-family ipv4 unicast
  network 203.0.113.0/24 route-map ORIGINATE
  redistribute static route-map RTBH-ORIGINATE
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 soft-reconfiguration inbound
  neighbor 198.51.100.1 route-map TRANSIT-IN in
  neighbor 198.51.100.1 route-map TO-64496 out
  neighbor 198.51.100.1 maximum-prefix 1100000 90 warning-only
  neighbor 198.51.100.9 activate
  neighbor 198.51.100.9 soft-reconfiguration inbound
  neighbor 198.51.100.9 route-map PEER-IN in
  neighbor 198.51.100.9 route-map TO-64497 out
  neighbor 198.51.100.9 maximum-prefix 1200 90 restart 30
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 soft-reconfiguration inbound
  neighbor 192.0.2.1 route-map IXP-RS-IN in
  neighbor 192.0.2.1 route-map TO-64510 out
  neighbor 192.0.2.1 maximum-prefix 250000 90 restart 30
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 soft-reconfiguration inbound
  neighbor 192.0.2.2 route-map IXP-RS-IN in
  neighbor 192.0.2.2 route-map TO-64510 out
  neighbor 192.0.2.2 maximum-prefix 250000 90 restart 30
  neighbor 198.51.100.17 activate
  neighbor 198.51.100.17 soft-reconfiguration inbound
  neighbor 198.51.100.17 route-map CUST-AS64511-IN in
  neighbor 198.51.100.17 route-map CUSTOMER-OUT out
  neighbor 198.51.100.17 maximum-prefix 50 90 restart 30
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:500::/40 route-map ORIGINATE
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:100::1 soft-reconfiguration inbound
  neighbor 2001:db8:100::1 route-map TRANSIT-IN in
  neighbor 2001:db8:100::1 route-map TO-64496 out
  neighbor 2001:db8:100::1 maximum-prefix 250000 90 warning-only
 exit-address-family
exit
!
! Maintenance (Lesson 7.1): "bgp graceful-shutdown" under router bgp
! drains every session by sending 65535:0; remove it after the work.
!
