! =====================================================================
! IXP MEMBER A - AS64499 (FRR)
! Another network on the IXP peering LAN, peering only through the two
! route servers. Its routes reach the DUT with next hop 192.0.2.99 and
! AS path starting with 64499 (the route server is transparent).
!
! M-LEGIT  45.30.0.0/16  own route                          -> ACCEPT
! M-LEAK   45.31.0.0/16  path 64499 174 (transit ASN)       -> REJECT (Lesson 3.6)
!
! It is also the observation point for EXPORT tests towards the IXP.
! LAB-ONLY address space - never connect this lab to the Internet.
! =====================================================================
frr defaults traditional
hostname member-a
service integrated-vtysh-config
!
interface eth1
 description IXP peering LAN
 ip address 192.0.2.99/24
exit
!
ip prefix-list M-LEAK seq 5 permit 45.31.0.0/16
!
route-map TRAPS-OUT permit 10
 match ip address prefix-list M-LEAK
 set as-path prepend 174
exit
route-map TRAPS-OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64499
 bgp router-id 192.0.2.99
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor RS peer-group
 neighbor RS remote-as 64510
 neighbor RS ebgp-multihop 255
 no neighbor RS enforce-first-as
 neighbor 192.0.2.1 peer-group RS
 neighbor 192.0.2.2 peer-group RS
 !
 address-family ipv4 unicast
  network 45.30.0.0/16
  network 45.31.0.0/16
  neighbor RS activate
  neighbor RS route-map ACCEPT-ALL in
  neighbor RS route-map TRAPS-OUT out
 exit-address-family
exit
!
