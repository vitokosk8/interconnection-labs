# =====================================================================
# IXP ROUTE SERVER 2 - AS64510 (BIRD 2)
# Transparent route server (RFC 7947): no ASN prepend, next hop kept.
#
# Deliberately PERMISSIVE: a production route server filters bogons,
# IRR and RPKI (MANRS IXP Action 1). This one passes everything, so the
# lab tests the DUT's own filters, not the route server's.
# =====================================================================
router id 192.0.2.2;
log stderr all;

protocol device { }

template bgp rsclient {
  local 192.0.2.2 as 64510;
  rs client;                 # transparent route server
  ttl security on;           # GTSM: sends and requires TTL 255
  ipv4 {
    import all;
    export all;
  };
}

protocol bgp dut from rsclient {
  description "DUT AS64500";
  neighbor 192.0.2.50 as 64500;
}

protocol bgp member_a from rsclient {
  description "Member A AS64499";
  neighbor 192.0.2.99 as 64499;
}
