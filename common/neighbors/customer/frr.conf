! =====================================================================
! CUSTOMER - AS64511 (FRR)
! Single-homed customer of the DUT. Receives the DUT's full table, which
! makes it the observation point for every IMPORT test: whatever the
! DUT accepted from transit, peer or IXP shows up here.
!
! C-IRR     198.51.100.0/24 in the customer's IRR set (the placeholder
!                           prefix list in every DUT config)  -> ACCEPT,
!                           tagged "do not announce to AS64497" with both
!                           64500:10:64497 (large) and 0:64497 (standard):
!                           must reach transit and IXP, NOT the peer (Lesson 4.6)
! C-NOTIRR  45.40.0.0/16    not in the IRR set                -> REJECT (Lesson 3.5, MANRS NO-1)
!
! LAB-ONLY address space - never connect this lab to the Internet.
! =====================================================================
frr defaults traditional
hostname customer
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.17/30
exit
!
ip prefix-list C-IRR seq 5 permit 198.51.100.0/24
!
route-map TRAPS-OUT permit 10
 match ip address prefix-list C-IRR
 set large-community 64500:10:64497
 set community 0:64497
exit
route-map TRAPS-OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64511
 bgp router-id 198.51.100.17
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.18 remote-as 64500
 neighbor 198.51.100.18 description DUT
 neighbor 198.51.100.18 password CHANGE-ME
 neighbor 198.51.100.18 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 45.40.0.0/16
  neighbor 198.51.100.18 activate
  neighbor 198.51.100.18 send-community all
  neighbor 198.51.100.18 route-map ACCEPT-ALL in
  neighbor 198.51.100.18 route-map TRAPS-OUT out
 exit-address-family
exit
!
