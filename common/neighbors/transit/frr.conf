! =====================================================================
! TRANSIT A - AS64496 (FRR)
! Upstream of the DUT. Announces a default route, a few "Internet"
! routes and a set of TRAP routes that a correctly configured DUT must
! reject (see common/tests/check.py for the expected results).
!
! "ebgp-multihop 255" makes this neighbor SEND packets with TTL 255
! (so GTSM-enabled DUTs accept them) while accepting any TTL itself.
!
! LAB-ONLY: the 45.x.0.0/16 prefixes are real address space used here
! only inside an isolated lab. Never connect this lab to the Internet.
! =====================================================================
frr defaults traditional
hostname transit
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.1/30
 ipv6 address 2001:db8:100::1/64
exit
!
! ---- Test routes (what each one tests) ------------------------------
! T-VALID      45.10.0.0/16  origin AS65536, RPKI Valid       -> ACCEPT
! T-NOTFOUND   45.11.0.0/16  origin AS65537, RPKI NotFound    -> ACCEPT
! T-INVALID    45.12.0.0/16  origin AS65537, ROA says AS65536 -> REJECT (Lesson 5.2)
! T-BOGON      10.0.0.0/8    RFC 1918                         -> REJECT (Lesson 3.2)
! T-TOOLONG    45.13.1.0/25  longer than /24                  -> REJECT (Lesson 3.2)
! T-OWN        203.0.113.0/25 more-specific of DUT space      -> REJECT (Lesson 3.4)
! T-IXP        192.0.2.0/24  IXP peering LAN                  -> REJECT (Lesson 3.4)
! T-BOGONASN   45.14.0.0/16  AS64512 (private) in path        -> REJECT (Lesson 3.3)
! T-LONGPATH   45.15.0.0/16  AS path of 52 ASNs               -> REJECT (Lesson 3.3)
! default      0.0.0.0/0     default-originate                -> REJECT (Lesson 3.4)
!
ip prefix-list T-VALID seq 5 permit 45.10.0.0/16
ip prefix-list T-NOTFOUND seq 5 permit 45.11.0.0/16
ip prefix-list T-INVALID seq 5 permit 45.12.0.0/16
ip prefix-list T-BOGONASN seq 5 permit 45.14.0.0/16
ip prefix-list T-LONGPATH seq 5 permit 45.15.0.0/16
!
route-map TRAPS-OUT permit 10
 match ip address prefix-list T-VALID
 set as-path prepend 65536
exit
route-map TRAPS-OUT permit 20
 match ip address prefix-list T-NOTFOUND
 set as-path prepend 65537
exit
route-map TRAPS-OUT permit 30
 match ip address prefix-list T-INVALID
 set as-path prepend 65537
exit
route-map TRAPS-OUT permit 40
 match ip address prefix-list T-BOGONASN
 set as-path prepend 64512 65537
exit
route-map TRAPS-OUT permit 50
 match ip address prefix-list T-LONGPATH
 set as-path prepend 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537 65537
exit
route-map TRAPS-OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.2 remote-as 64500
 neighbor 198.51.100.2 description DUT
 neighbor 198.51.100.2 password CHANGE-ME
 neighbor 198.51.100.2 ebgp-multihop 255
 neighbor 2001:db8:100::2 remote-as 64500
 neighbor 2001:db8:100::2 description DUT-V6
 neighbor 2001:db8:100::2 password CHANGE-ME
 neighbor 2001:db8:100::2 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 45.10.0.0/16
  network 45.11.0.0/16
  network 45.12.0.0/16
  network 10.0.0.0/8
  network 45.13.1.0/25
  network 203.0.113.0/25
  network 192.0.2.0/24
  network 45.14.0.0/16
  network 45.15.0.0/16
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 default-originate
  neighbor 198.51.100.2 route-map ACCEPT-ALL in
  neighbor 198.51.100.2 route-map TRAPS-OUT out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:4510::/48
  neighbor 2001:db8:100::2 activate
  neighbor 2001:db8:100::2 route-map ACCEPT-ALL in
  neighbor 2001:db8:100::2 route-map ACCEPT-ALL out
 exit-address-family
exit
!
