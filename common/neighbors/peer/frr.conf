! =====================================================================
! PRIVATE PEER - AS64497 (FRR)
! Settlement-free peer of the DUT.
!
! P-LEGIT  45.20.0.0/16  own route; also carries FAKE "customer" tags
!                        64500:1:3 / 64500:1003            -> ACCEPT, but the
!                        DUT must scrub the fake tag and must NOT export
!                        this route to transit or the IXP (Lessons 3.7, 4.4)
! P-LEAK   45.21.0.0/16  path 64497 3356 65538 (transit ASN behind a peer)
!                                                            -> REJECT (Lesson 3.6)
!
! LAB-ONLY address space - never connect this lab to the Internet.
! =====================================================================
frr defaults traditional
hostname peer
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.9/30
exit
!
ip prefix-list P-LEGIT seq 5 permit 45.20.0.0/16
ip prefix-list P-LEAK seq 5 permit 45.21.0.0/16
!
route-map TRAPS-OUT permit 10
 match ip address prefix-list P-LEGIT
 set large-community 64500:1:3
 set community 64500:1003
exit
route-map TRAPS-OUT permit 20
 match ip address prefix-list P-LEAK
 set as-path prepend 3356 65538
exit
route-map TRAPS-OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64497
 bgp router-id 198.51.100.9
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.10 remote-as 64500
 neighbor 198.51.100.10 description DUT
 neighbor 198.51.100.10 password CHANGE-ME
 neighbor 198.51.100.10 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 45.20.0.0/16
  network 45.21.0.0/16
  neighbor 198.51.100.10 activate
  neighbor 198.51.100.10 send-community all
  neighbor 198.51.100.10 route-map ACCEPT-ALL in
  neighbor 198.51.100.10 route-map TRAPS-OUT out
 exit-address-family
exit
!
