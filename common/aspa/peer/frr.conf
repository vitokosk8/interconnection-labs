! =====================================================================
! ASPA LAB - PEER - AS64497 (FRR)
! Lateral peer: routes arrive UPSTREAM (ASPA upstream verification).
!   A-P-VALID   45.70.0.0/16  path 64497              own route                  -> Valid   -> ACCEPT
!   A-P-LEAK    45.71.0.0/16  path 64497 65545 65547  the peer passes on a route from its own
!                             provider AS65545 (ASPA of 65545 does not list 64497) -> Invalid -> REJECT
!
! LAB-ONLY address space - never connect this lab to the Internet.
! ASPA records: common/aspa/rpki/aspa.json
! =====================================================================
frr defaults traditional
hostname peer
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.9/30
exit
!
ip prefix-list R10 seq 5 permit 45.70.0.0/16
ip prefix-list R20 seq 5 permit 45.71.0.0/16
!
route-map OUT permit 10
 match ip address prefix-list R10
exit
route-map OUT permit 20
 match ip address prefix-list R20
 set as-path prepend 65545 65547
exit
route-map OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64497
 bgp router-id 198.51.100.9
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.10 remote-as 64500
 neighbor 198.51.100.10 description DUT
 neighbor 198.51.100.10 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 45.70.0.0/16
  network 45.71.0.0/16
  neighbor 198.51.100.10 activate
  neighbor 198.51.100.10 route-map ACCEPT-ALL in
  neighbor 198.51.100.10 route-map OUT out
 exit-address-family
exit
!
