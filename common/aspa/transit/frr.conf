! =====================================================================
! ASPA LAB - TRANSIT (our provider) - AS64496 (FRR)
! Our provider: routes arrive DOWNSTREAM (ASPA downstream verification).
!   A-T-VALID   45.80.0.0/16  path 64496 65540        65540 is a customer of 64496 -> Valid   -> ACCEPT
!   A-T-VALLEY  45.81.0.0/16  path 64496 65541 65542  valley: 65541 sent a route it got
!                             from a non-customer to a non-customer (leak)      -> Invalid -> REJECT
!   A-T-UNKNOWN 45.82.0.0/16  path 64496 65549 65550  no ASPA for 65549/65550    -> Unknown -> ACCEPT
!
! LAB-ONLY address space - never connect this lab to the Internet.
! ASPA records: common/aspa/rpki/aspa.json
! =====================================================================
frr defaults traditional
hostname transit
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.1/30
exit
!
ip prefix-list R10 seq 5 permit 45.80.0.0/16
ip prefix-list R20 seq 5 permit 45.81.0.0/16
ip prefix-list R30 seq 5 permit 45.82.0.0/16
!
route-map OUT permit 10
 match ip address prefix-list R10
 set as-path prepend 65540
exit
route-map OUT permit 20
 match ip address prefix-list R20
 set as-path prepend 65541 65542
exit
route-map OUT permit 30
 match ip address prefix-list R30
 set as-path prepend 65549 65550
exit
route-map OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.2 remote-as 64500
 neighbor 198.51.100.2 description DUT
 neighbor 198.51.100.2 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 45.80.0.0/16
  network 45.81.0.0/16
  network 45.82.0.0/16
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map ACCEPT-ALL in
  neighbor 198.51.100.2 route-map OUT out
 exit-address-family
exit
!
