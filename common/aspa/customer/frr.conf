! =====================================================================
! ASPA LAB - CUSTOMER - AS64511 (FRR)
! Multihomed customer (providers: us AS64500 and AS65536). Routes arrive
! UPSTREAM; it also receives our full table, so it is the observation point
! for the routes from transit and peer.
!   A-C-VALID   45.60.0.0/16  path 64511              own route                  -> Valid   -> ACCEPT
!   A-C-LEAK    45.61.0.0/16  path 64511 65536 65537  route from its OTHER provider leaked to
!                             us (ASPA of 65536 does not list 64511)             -> Invalid -> REJECT
!   A-C-UNKNOWN 45.62.0.0/16  path 64511 65546        no ASPA for 65546          -> Unknown -> ACCEPT
!
! LAB-ONLY address space - never connect this lab to the Internet.
! ASPA records: common/aspa/rpki/aspa.json
! =====================================================================
frr defaults traditional
hostname customer
service integrated-vtysh-config
!
interface eth1
 description to DUT
 ip address 198.51.100.17/30
exit
!
ip prefix-list R10 seq 5 permit 45.60.0.0/16
ip prefix-list R20 seq 5 permit 45.61.0.0/16
ip prefix-list R30 seq 5 permit 45.62.0.0/16
!
route-map OUT permit 10
 match ip address prefix-list R10
exit
route-map OUT permit 20
 match ip address prefix-list R20
 set as-path prepend 65536 65537
exit
route-map OUT permit 30
 match ip address prefix-list R30
 set as-path prepend 65546
exit
route-map OUT permit 100
exit
!
route-map ACCEPT-ALL permit 10
exit
!
router bgp 64511
 bgp router-id 198.51.100.17
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 198.51.100.18 remote-as 64500
 neighbor 198.51.100.18 description DUT
 neighbor 198.51.100.18 ebgp-multihop 255
 !
 address-family ipv4 unicast
  network 45.60.0.0/16
  network 45.61.0.0/16
  network 45.62.0.0/16
  neighbor 198.51.100.18 activate
  neighbor 198.51.100.18 route-map ACCEPT-ALL in
  neighbor 198.51.100.18 route-map OUT out
 exit-address-family
exit
!
